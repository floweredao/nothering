name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']

# A new push to a PR supersedes its in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Index-while-building only feeds the editor, so skip it on CI.
  BUILD_FLAGS: CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

jobs:
  mac:
    name: Mac (build + test) and iOS (build)
    # macOS arm64 hosted runners are capacity-limited (jobs were cancelled unacquired); deployment targets are macOS 15 / iOS 18.
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the Tuist version pinned in mise.toml, keeping CI and local dev
      # in sync. Not Homebrew: the tuist tap's cask declares `conflicts_with
      # formula:`, a key Homebrew 6 dropped, which aborts any `tuist` lookup in
      # the tap. See tuist/homebrew-tuist#41.
      - name: Install Tuist
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Generate Project
        run: tuist generate --no-open

      # The workspace scheme covers every macOS target (menu bar app, CLI,
      # system extension, and both test bundles), so one invocation builds it
      # all and the test run reuses those products.
      - name: Build
        run: |
          xcodebuild build-for-testing \
            -workspace Nothering.xcworkspace \
            -scheme Nothering-Workspace \
            -configuration Debug \
            -destination 'platform=macOS' \
            $BUILD_FLAGS

      - name: Test
        run: |
          xcodebuild test-without-building \
            -workspace Nothering.xcworkspace \
            -scheme Nothering-Workspace \
            -configuration Debug \
            -destination 'platform=macOS' \
            $BUILD_FLAGS

      # Same runner as the Mac build: macOS runners are capacity-limited, so one job avoids a second queue wait.
      - name: Build iOS
        run: |
          xcodebuild build \
            -workspace Nothering.xcworkspace \
            -scheme NotheringiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            $BUILD_FLAGS
